info:
  name: Public API - jsonplaceholder Users
  type: http
  seq: 17

http:
  method: GET
  url: https://jsonplaceholder.typicode.com/users
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200 байна", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("хариу массив байна", function() {
          expect(res.getBody()).to.be.an('array');
        });

        test("эхний хэрэглэгчийн нэр зөв байна", function() {
          expect(res.getBody()[0].name).to.equal("Leanne Graham");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
